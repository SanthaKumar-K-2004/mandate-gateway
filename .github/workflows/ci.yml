name: Continuous Integration & Security Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Execute Master Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & quality toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight & Environment Init
        run: |
          cp .env.example .env

      - name: Run Master Quality Gate (make check)
        env:
          PYTHONPATH: .
          PYTHON: python
        run: |
          make check PYTHON=python

      - name: Run Production Reality Certification Script
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_production_reality_certification.py

      - name: Run External MCP Interoperability Suite
        env:
          PYTHONPATH: .
        run: |
          python scripts/mcp_client_test_runner.py
