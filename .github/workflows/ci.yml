name: Continuous Integration & Security Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Execute Master Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Quality Gate (make check)
        run: |
          make check

      - name: Run Production Reality Certification Script
        run: |
          PYTHONPATH=. python3 scripts/run_production_reality_certification.py

      - name: Run External MCP Interoperability Suite
        run: |
          PYTHONPATH=. python3 scripts/mcp_client_test_runner.py
