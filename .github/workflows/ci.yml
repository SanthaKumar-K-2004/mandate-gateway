name: Mandate Gateway Production CI/CD Pipeline
# Section M10 — Continuous Integration, Validation & Release Readiness

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  # Stage A: Code Quality & Static Analysis
  code-quality:
    name: Stage A — Static Code & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Development Toolchain
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] || pip install black flake8 mypy alembic sqlalchemy redis pydantic

      - name: Run Master Quality Gate (make check)
        run: |
          make check

  # Stage B: Migration Validation
  migration-validation:
    name: Stage B — Database Migration Validation
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . || pip install alembic sqlalchemy pydantic

      - name: Verify Migration Script History & Alembic Config
        run: |
          python -m unittest tests/integration/test_m09_migration_discipline.py

  # Stage C: Container Build & Security Inspection
  container-build:
    name: Stage C — Container Build & Image Hygiene
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Mandate Gateway Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: mandate-gateway:ci-candidate

      - name: Verify Non-Root User Execution
        run: |
          grep -q "USER appuser:appgroup" Dockerfile || (echo "ERROR: Dockerfile must enforce USER appuser:appgroup" && exit 1)

  # Stage D: Comprehensive Test Suite & Acceptance
  test-suite:
    name: Stage D — Full Regression & Acceptance Matrix
    runs-on: ubuntu-latest
    needs: [migration-validation, container-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . || pip install alembic sqlalchemy redis pydantic

      - name: Run Complete Test Suite
        run: |
          python -m unittest discover -s tests
