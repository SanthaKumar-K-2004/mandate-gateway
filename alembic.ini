# Mandate Gateway — Alembic Migration Configuration
[alembic]
script_location = db/migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC
prepend_sys_path = .

[logging]
default_handler = console

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
